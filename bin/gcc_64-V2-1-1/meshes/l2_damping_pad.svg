<?xml version="1.0" encoding="UTF-8"?>
<!--
  Unitree 4D LiDAR L2 — TPU damping pad
  Source dims: Unitree 4D LiDAR L2 User Manual v1.1 (2024.10), page 8
    - Body outer footprint Ø75 mm (Ø60 in the drawing is an internal
      assembly feature, not the user-visible outer edge)
    - Bolt circle Ø51 mm, 4× M3 mounting holes
    - Holes 90° apart (square pattern), rotated 22.5° from the cable-exit
      axis — i.e. at 22.5°, 112.5°, 202.5°, 292.5° measured from +X
  Pad spec:
    - Outer Ø79 mm (75 + 2 mm overhang per side)
    - Holes Ø3.5 mm (M3 clearance, slight oversize for TPU stretch)
    - Cable-exit axis = -Y direction in this drawing
  Units: mm. viewBox is 1:1 mm.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="79mm" height="79mm"
     viewBox="-39.5 -39.5 79 79">
  <g fill="none" stroke="black" stroke-width="0.2" stroke-linecap="round">
    <!-- Outer disc, Ø79 -->
    <circle cx="0" cy="0" r="39.5"/>
    <!-- 4 mounting holes, Ø3.5, on Ø51 bolt circle, 90° apart, square rotated 22.5° -->
    <circle cx="23.5594"  cy="9.7592"   r="1.75"/>
    <circle cx="-9.7592"  cy="23.5594"  r="1.75"/>
    <circle cx="-23.5594" cy="-9.7592"  r="1.75"/>
    <circle cx="9.7592"   cy="-23.5594" r="1.75"/>
  </g>
  <!-- Centerline crosshair (non-cut reference; stroke kept thin) -->
  <g fill="none" stroke="#aaaaaa" stroke-width="0.1" stroke-dasharray="1,1">
    <line x1="-39.5" y1="0" x2="39.5" y2="0"/>
    <line x1="0" y1="-39.5" x2="0" y2="39.5"/>
  </g>
</svg>
