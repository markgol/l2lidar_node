l2lidar_node:
  ros__parameters:

    # ---------------- Network ----------------
    l2_ip: "192.168.1.62"
    l2_port: 6101

    host_ip: "192.168.1.2"
    host_port: 6201

    # ---------------- Time Sync ----------------
    # both of these bools must be true for aggregation
    enable_l2_time_correction: true
    enable_l2_host_sync: true
    # adjust time scale numerator and denominator
    #    2,1 -> 2.0 is the ideal
    # you can adjust to correct for what the
    # accuracy of the internal oscillator versus your host
    # for exmaple 1998,1000 ->1.998
    timeScaleNum: 2
    timeScaleDenom: 1

    # sync rate host -> L2 (milliseconds)
    l2_sync_rate_ms: 30

    # ---------------- Latency ----------------
    enable_latency_measure: false

    # ---------------- Frames ----------------
    frame_id: "l2lidar_frame"
    imu_frame_id: "l2lidar_imu"
    disable_base_link_pub: false
    robot_id: "base_link"
    robot_x: 0.1
    robot_y: 0.0
    robot_z: 0.25

    # ---------------- Point Cloud ----------------
    frame3d: true
    imu_adjust: false

    # ---------------- Calibration Override ----------------
    EnableCalRangeOVR: true
    calRangeScale: 0.000978
    calRangeBias: -525.0
    
    #----------------- Watch dog timer -----
    watchdog_timeout_ms: 60000

    # ---------------- IMU publishing ------------
    enable_IMU_publishing: true
    # covariance values
    # base stationay noise variance (stddev squared)
    # from the IMU acceleration and gyroscope values
    accel_x_covar: 0.01  # std dev 0.1 -> variance 0.01
    accel_y_covar: 0.01  # std dev 0.1 -> variance 0.01
    accel_z_covar: 0.01  # std dev 0.1 -> variance 0.01
    gyro_x_covar: 0.000025 # std dev .005 -> variance 0.000025
    gyro_y_covar: 0.000026 # std dev .005 -> variance 0.000025
    gyro_z_covar: 0.0000002 # std dev .0001 use variance 0.0000002

    # ---------------- point cloud frames ----------------
    # If this is set to 0 there is no aggregation
    # 38 is the number of frames per full hemishpere
    # rotation.  Note that he L2 does not have exactly
    # 38 per rotation.  Th precession of the scans fills
    # in between the last rotation scans.
    aggregateNframes: 38
    
